[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vinted-search-mcp"
version = "0.1.0"
description = "MCP server for searching second-hand listings on Vinted (anonymous, read-only)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/ThiagoJacobLannes/vinted-mcp"

[project.scripts]
vinted-search-mcp = "vinted_mcp.server:main"
vinted-mcp = "vinted_mcp.server:main"

[tool.setuptools]
packages = ["vinted_mcp"]
